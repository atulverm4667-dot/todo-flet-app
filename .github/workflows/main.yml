name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      # PROPER VERSION FIX: Flet 1.0.3 ke liye exact Flutter 3.24.3 lock kar diya
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          
      - name: Accept Flutter Android Licenses
        run: yes | flutter doctor --android-licenses
          
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install flet
          pip install -r requirements.txt
        
      - name: Build APK with Flet
        run: (yes || true) | flet build apk
        
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: ToDo-App-APK
          path: build/apk/**/*.apk
