name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      # 1. Exact wahi version jo Flet mangta hai (bina iske Flet aage nahi badhega)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          
      # 2. Android aur Linux ki zaroori files jo 'flutter doctor' ko pass karti hain
      - name: Setup System Requirements
        run: |
          yes | flutter doctor --android-licenses
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install flet
          pip install -r requirements.txt
        
      # 3. Koyi 'yes' ya 'echo' nahi, seedha plain build command
      - name: Build APK with Flet
        run: flet build apk
        
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: ToDo-App-APK
          path: build/apk/**/*.apk
