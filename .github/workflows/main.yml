name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      # YAHAN SE FLUTTER ACTION HATA DIYA HAI - Flet khud manage karega
          
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install flet
          pip install -r requirements.txt
        
      # MAGIC FIX: 'set +o pipefail' GitHub ko crash hone se rokega jab hum auto-answer "yes" bhejenge
      - name: Build APK with Flet
        run: |
          set +o pipefail
          yes | flet build apk
        
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: ToDo-App-APK
          path: build/apk/**/*.apk
